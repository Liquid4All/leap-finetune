project_name: "my_kto_project"
model_name: "LFM2-1.2B"
training_type: "kto"

dataset:
  path: "trl-lib/kto-mix-14k"
  type: "kto"
  limit: 1000
  test_size: 0.2

training_config:
  extends: "DEFAULT_KTO"
  num_train_epochs: 1
  per_device_train_batch_size: 8
  learning_rate: 1e-6

peft_config:
  extends: "DEFAULT_LORA"
  use_peft: true
