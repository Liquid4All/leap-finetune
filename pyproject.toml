[project]
name = "leap-finetune"
version = "0.1.0"
description = "A minimal fine-tuning repo for LFM2, fully built on Open Source."
readme = "README.md"
authors = [
    { name = "Liquid AI", email = "support@liquid.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.7.0",
    "peft>=0.15.2",
    "deepspeed>=0.17.1; sys_platform == 'linux'",
    "torch>=2.10.0,<2.12.0",
    "transformers>=5.3.0,<5.4.0",
    "numpy>=2.4.1",
    "trl>=1.0,<2.0",
    "rich>=14.1.0",
    "pillow>=11.3.0",
    "mpi4py>=4.1.0; sys_platform == 'linux'",
    "wandb>=0.22.3",
    "ray==2.51.1",
    "pyyaml>=6.0",
    "turm>=0.13.0; sys_platform == 'linux'",
    "torchvision>=0.24.1",
    "modal>=0.73",
    "trackio>=0.3",
    "typer>=0.20.0",
    "kubernetes>=34.0.0",
    "pydantic>=2.0",
    "bitsandbytes>=0.48.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
# OpenEnv RL environments — only needed if you use rl_env in your config.
# Install with: uv sync --extra rl-env
rl-env = [
    "openenv-core>=0.1; sys_platform == 'linux'",
]

[project.scripts]
leap-finetune = "leap_finetune:main"
leap-export-manual-sharded-checkpoint = "leap_finetune.cli.export_manual_sharded_checkpoint:main"
leap-export-gguf = "leap_finetune.cli.export_gguf:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# External flash-attn is optional because vLLM pins the CUDA stack tightly.
# If installed via `uv sync --group flash-attn`, build against the runtime
# torch ABI instead of an isolated build environment.
no-build-isolation-package = ["flash-attn"]
default-groups = ["dev", "cuda"]
environments = [
    "python_version == '3.12' and sys_platform == 'darwin'",
    "python_version == '3.12' and sys_platform == 'linux'",
]
# CUDA is the default GPU stack. ROCm pulls vLLM and its torch stack from a different index,
# so it must be selected explicitly instead of the default cuda group:
#   uv sync --no-group cuda --group rocm
conflicts = [
    [{ group = "cuda" }, { group = "rocm" }],
    [{ group = "flash-attn" }, { group = "rocm" }],
]

# vLLM wheels can declare dependency ranges that lag the LFM Transformers /
# Hugging Face Hub stack. The override is intentional and covered by the GRPO
# smoke fixtures, which leave use_vllm enabled to match shipped defaults.
override-dependencies = [
    # Override so vLLM resolves with the LFM-validated Transformers 5.3 stack.
    "transformers>=5.3.0,<5.4.0",
    "huggingface_hub>=1.0",
    "numpy<2.5",
]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.3"
requires-dist = ["torch", "einops", "ninja", "packaging", "setuptools", "wheel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "configs: config parsing, validation, override, filtering (no GPU)",
    "data: data loading, validation, tokenization, and packing tests",
    "distribution: launch, resource planning, and backend integration tests (no GPU unless explicitly marked)",
    "evaluation: benchmark, metric, and async evaluation tests",
    "rl: RL data, rewards, rollout, and environment tests",
    "dense: dense model end-to-end training tests",
    "vlm: VLM end-to-end training tests",
    "moe: MoE end-to-end training tests",
]
addopts = "-v --tb=short"

[tool.ruff]
exclude = ["src/leap_finetune/quantization/gguf"]

[dependency-groups]
cuda = [
    "liger-kernel>=0.6.2; sys_platform == 'linux'",
    # Keep CUDA vLLM pinned. External flash-attn remains opt-in below; vLLM
    # uses its own kernels for GRPO in the default CUDA install path.
    "vllm==0.22.0; sys_platform == 'linux'",
]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.0",
    "ruff>=0.11.13",
]
flash-attn = [
    # Optional HF FA2 support for environments with a known-good wheel/build.
    # Model loading still probes the import at runtime and falls back to SDPA.
    "flash-attn==2.8.3; sys_platform == 'linux'",
]
rocm = [
    # Direct URLs freeze the validated ROCm wheel set. The vLLM ROCm simple
    # index is mutable and can advertise a newer torch/aiter stack for the same
    # package names.
    "amd-aiter @ https://wheels.vllm.ai/rocm/799c3afa5d5b17b676d04e0b58a5628943bb4003/amd_aiter-0.1.13-cp312-cp312-manylinux_2_34_x86_64.whl; sys_platform == 'linux'",
    "amdsmi @ https://wheels.vllm.ai/rocm/799c3afa5d5b17b676d04e0b58a5628943bb4003/amdsmi-26.2.2%2B671d39a71e-py3-none-any.whl; sys_platform == 'linux'",
    "flash-attn @ https://wheels.vllm.ai/rocm/799c3afa5d5b17b676d04e0b58a5628943bb4003/flash_attn-2.8.3-cp312-cp312-manylinux_2_34_x86_64.whl; sys_platform == 'linux'",
    "torch @ https://wheels.vllm.ai/rocm/799c3afa5d5b17b676d04e0b58a5628943bb4003/torch-2.10.0%2Bgit8514f05-cp312-cp312-manylinux_2_35_x86_64.whl; sys_platform == 'linux'",
    "torchaudio @ https://wheels.vllm.ai/rocm/799c3afa5d5b17b676d04e0b58a5628943bb4003/torchaudio-2.9.0%2Beaa9e4e-cp312-cp312-manylinux_2_34_x86_64.whl; sys_platform == 'linux'",
    "torchvision @ https://wheels.vllm.ai/rocm/799c3afa5d5b17b676d04e0b58a5628943bb4003/torchvision-0.24.1%2Bd801a34-cp312-cp312-manylinux_2_34_x86_64.whl; sys_platform == 'linux'",
    "triton @ https://wheels.vllm.ai/rocm/799c3afa5d5b17b676d04e0b58a5628943bb4003/triton-3.6.0-cp312-cp312-manylinux_2_35_x86_64.whl; sys_platform == 'linux'",
    "triton-kernels @ https://wheels.vllm.ai/rocm/799c3afa5d5b17b676d04e0b58a5628943bb4003/triton_kernels-1.0.0-py3-none-any.whl; sys_platform == 'linux'",
    "liger-kernel>=0.6.2; sys_platform == 'linux'",
    "vllm @ https://wheels.vllm.ai/rocm/799c3afa5d5b17b676d04e0b58a5628943bb4003/vllm-0.22.0%2Brocm722-cp312-cp312-manylinux_2_34_x86_64.whl; sys_platform == 'linux'",
]
