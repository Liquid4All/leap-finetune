project_name: "lfm25_embedding"
model_name: "LiquidAI/LFM2.5-Embedding-350M"
training_type: "embedding"

dataset:
  path: "sentence-transformers/msmarco-bm25"
  subset: "triplet"
  split: "train"
  type: "embedding"
  limit: 10000
  test_size: 0.01

training_config:
  extends: "DEFAULT_EMBEDDING"
  num_train_epochs: 1
  per_device_train_batch_size: 32
  learning_rate: 2e-5

peft_config:
  use_peft: false
