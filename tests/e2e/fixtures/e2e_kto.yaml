project_name: "e2e_kto"
model_name: "LFM2-1.2B"
training_type: "kto"

dataset:
  path: "tests/e2e/fixtures/tiny_kto.jsonl"
  type: "kto"
  limit: 16
  test_size: 0.5

training_config:
  extends: "DEFAULT_KTO"
  num_train_epochs: 1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  learning_rate: 2e-5
  max_length: 128
  save_strategy: "no"
  eval_strategy: "epoch"
  logging_steps: 1

peft_config:
  extends: "DEFAULT_LORA"
  use_peft: true
